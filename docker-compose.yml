services:

  # ─── Banco de Dados MySQL ───────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: siscontabil_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: siscontabil
      MYSQL_USER: siscontabil
      MYSQL_PASSWORD: siscontabil@2025
      MYSQL_ROOT_PASSWORD: root@2025
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Laravel ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: siscontabil_api
    restart: unless-stopped
    volumes:
      - ./siscontabil-api/storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: SisContabil
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://192.168.1.75:8080

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: siscontabil
      DB_USERNAME: siscontabil
      DB_PASSWORD: siscontabil@2025

      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database

      SISCOMEX_VERIFY_SSL: true

  # ─── Frontend React/Vite ────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: siscontabil_web
    restart: unless-stopped
    depends_on:
      - api

  # ─── Proxy Reverso Nginx ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: siscontabil_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf
      - ./siscontabil-api/public:/var/www/public:ro
    depends_on:
      - api
      - web

volumes:
  mysql_data:
