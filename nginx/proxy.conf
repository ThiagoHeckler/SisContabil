server {
    listen 80;

    # DNS interno do Docker. Faz o nginx re-resolver os nomes (web, api)
    # em tempo de execução, evitando cache de IP obsoleto quando um
    # container é recriado (causa comum de 502 "connection refused").
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rotas da API Laravel (PHP-FPM)
    location /api {
        try_files $uri $uri/ @api;
    }

    location @api {
        set $api_fpm api:9000;              # variável força resolução dinâmica
        fastcgi_pass $api_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    # Frontend React (tudo que não for /api)
    location / {
        set $web_upstream http://web:80;   # variável força resolução dinâmica
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
